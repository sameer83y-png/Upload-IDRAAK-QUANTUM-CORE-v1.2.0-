name: Android Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and test Idraak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Run offline command tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Upload debug APK
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: idraak-quantum-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Check release signing secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IDRAAK_KEYSTORE_BASE64: ${{ secrets.IDRAAK_KEYSTORE_BASE64 }}
          IDRAAK_KEYSTORE_PASSWORD: ${{ secrets.IDRAAK_KEYSTORE_PASSWORD }}
          IDRAAK_KEY_ALIAS: ${{ secrets.IDRAAK_KEY_ALIAS }}
          IDRAAK_KEY_PASSWORD: ${{ secrets.IDRAAK_KEY_PASSWORD }}
        run: |
          test -n "$IDRAAK_KEYSTORE_BASE64" || (echo "Missing IDRAAK_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$IDRAAK_KEYSTORE_PASSWORD" || (echo "Missing IDRAAK_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$IDRAAK_KEY_ALIAS" || (echo "Missing IDRAAK_KEY_ALIAS secret" && exit 1)
          test -n "$IDRAAK_KEY_PASSWORD" || (echo "Missing IDRAAK_KEY_PASSWORD secret" && exit 1)

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IDRAAK_KEYSTORE_BASE64: ${{ secrets.IDRAAK_KEYSTORE_BASE64 }}
          IDRAAK_KEYSTORE_PASSWORD: ${{ secrets.IDRAAK_KEYSTORE_PASSWORD }}
          IDRAAK_KEY_ALIAS: ${{ secrets.IDRAAK_KEY_ALIAS }}
          IDRAAK_KEY_PASSWORD: ${{ secrets.IDRAAK_KEY_PASSWORD }}
          IDRAAK_VERSION_NAME: ${{ github.ref_name }}
          IDRAAK_VERSION_CODE: ${{ github.run_number }}
        run: |
          export IDRAAK_VERSION_NAME="${IDRAAK_VERSION_NAME#v}"
          gradle --no-daemon clean :app:assembleRelease

      - name: Publish official GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
