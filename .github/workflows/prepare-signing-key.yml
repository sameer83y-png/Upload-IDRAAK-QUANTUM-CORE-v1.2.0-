name: Prepare Idraak Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-key:
    name: Create one-time upload key
    runs-on: ubuntu-latest
    steps:
      - name: Generate signing keystore
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"
          KEY_ALIAS="idraak-release"
          keytool -genkeypair -v \
            -keystore idraak-release.jks \
            -storetype JKS \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASS" \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=Idraak Quantum, OU=Android, O=Idraak, L=NA, ST=NA, C=IN"
          KEYSTORE_B64="$(base64 -w 0 idraak-release.jks)"
          {
            echo "IDRAAK_KEYSTORE_BASE64=$KEYSTORE_B64"
            echo "IDRAAK_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "IDRAAK_KEY_ALIAS=$KEY_ALIAS"
            echo "IDRAAK_KEY_PASSWORD=$KEY_PASS"
          } > github-secrets.txt
          chmod 600 idraak-release.jks github-secrets.txt

      - name: Upload private bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: idraak-signing-bootstrap
          path: |
            idraak-release.jks
            github-secrets.txt
          retention-days: 1
