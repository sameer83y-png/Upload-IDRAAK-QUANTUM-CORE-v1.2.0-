name:
IDRAAK QUANTUM CORE APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check ZIP file
        run: |
          test -f IDRAAK-QUANTUM-CORE.zip
          echo "Project ZIP found."

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -oq IDRAAK-QUANTUM-CORE.zip -d source
          test -d source/IDRAAK-QUANTUM-CORE/app
          echo "Project extracted successfully."

      - name: Publish project files to GitHub
        run: |
          cp -a source/IDRAAK-QUANTUM-CORE/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A app settings.gradle build.gradle gradle.properties .gitignore README.md .github/workflows/build-apk.yml

          if ! git diff --cached --quiet; then
            git commit -m "Extract IDRAAK Android project files"
            git push
          else
            echo "Project files are already published."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDRAAK-QUANTUM-CORE-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
